<div th:fragment="fgt-booking-list">
    <h2>Booking List</h2>

    <div class="sd-custom-table-wrapper">
        <table class="sd-custom-table" id="bookingTable">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">Booking ID ⬍</th>
                    <th onclick="sortTable(1)">Customer Name ⬍</th>
                    <th onclick="sortTable(2)">Room ⬍</th>
                    <th onclick="sortTable(3)">Arriving Date ⬍</th>
                    <th onclick="sortTable(4)">Departure Date ⬍</th>
                    <th onclick="sortTable(5)">Status ⬍</th>
                    <th colspan="3">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}" th:classappend="
                    ${booking.bookingStatus.name() == 'DECLINED'} ? 'cancelled-booking' :
                    (${booking.bookingStatus.name() == 'ACCEPTED'} ? 'accepted-booking' : '')">
                    <td th:text="${booking.bookingId}">1</td>
                    <td th:text="${booking.username}">John Doe</td>
                    <td>
                        <span th:text="${booking.roomTitle}">Deluxe Suite</span>
                        (<span th:text="${booking.roomId}">5</span>)
                    </td>
                    <td th:text="${booking.formattedArrivingDate}">10/07/2025</td>
                    <td th:text="${booking.formattedDepartureDate}">12/07/2025</td>
                    <td th:text="${booking.bookingStatus}">PENDING</td>

                    <!-- Edit -->
                    <td class="action-cell borderless">
                        <a href="#" title="Edit">
                            <i class="fas fa-edit icon-edit"></i>
                        </a>
                    </td>

                    <!-- Decline -->
                    <td class="action-cell borderless">
                        <span th:if="${booking.bookingStatus.name() != 'PENDING'}">
                            <i class="fas fa-times text-muted" th:title="${booking.bookingStatus.name() == 'DECLINED'} ?
                                'Reservation already declined' :
                                'Cannot decline an accepted reservation'"></i>
                        </span>
                        <form th:if="${booking.bookingStatus.name() == 'PENDING'}" th:action="@{/api/booking/decline}"
                            method="post" style="display: inline;">
                            <input type="hidden" name="bookingId" th:value="${booking.bookingId}" />
                            <button type="submit" class="btn btn-link p-0" title="Decline">
                                <i class="fas fa-times text-danger"></i>
                            </button>
                        </form>
                    </td>

                    <!-- Accept -->
                    <td class="action-cell borderless">
                        <span th:if="${booking.bookingStatus.name() != 'PENDING'}">
                            <i class="fas fa-check text-muted" th:title="${booking.bookingStatus.name() == 'DECLINED'} ?
                                'Cannot accept a cancelled reservation' :
                                'Reservation already accepted'"></i>
                        </span>
                        <form th:if="${booking.bookingStatus.name() == 'PENDING'}" th:action="@{/api/booking/accept}"
                            method="post" style="display: inline;">
                            <input type="hidden" name="bookingId" th:value="${booking.bookingId}" />
                            <button type="submit" class="btn btn-link p-0" title="Accept">
                                <i class="fas fa-check text-success"></i>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <script>
        let currentSortColumn = -1;
        let currentSortDir = "asc";

        function sortTable(n) {
            const table = document.getElementById("bookingTable");
            const tbody = table.querySelector("tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));

            let dir = "asc";
            if (n === currentSortColumn && currentSortDir === "asc") {
                dir = "desc";
            }
            currentSortColumn = n;
            currentSortDir = dir;

            rows.sort((rowA, rowB) => {
                let cellA = rowA.cells[n].innerText.trim().toLowerCase();
                let cellB = rowB.cells[n].innerText.trim().toLowerCase();

                const isDate = /\d{2}\/\d{2}\/\d{4}/.test(cellA);
                if (isDate) {
                    cellA = new Date(cellA.split("/").reverse().join("-"));
                    cellB = new Date(cellB.split("/").reverse().join("-"));
                } else if (!isNaN(cellA) && cellA !== '') {
                    cellA = parseFloat(cellA);
                    cellB = parseFloat(cellB);
                }

                if (cellA < cellB) return dir === "asc" ? -1 : 1;
                if (cellA > cellB) return dir === "asc" ? 1 : -1;
                return 0;
            });

            tbody.innerHTML = "";
            rows.forEach(row => tbody.appendChild(row));
        }
    </script>
</div>
