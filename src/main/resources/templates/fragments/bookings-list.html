<div th:fragment="fgt-booking-list" id="booking-list" class="margin-fgt">
    <h1>Booking List</h1>
    <div>
        <table class="sd-custom-table" id="bookingTable">
            <thead>
                <tr>
                    <th onclick="sortTable(0)">Booking ID ⬍</th>
                    <th onclick="sortTable(1)">Customer Name ⬍</th>
                    <th onclick="sortTable(2)">Room ⬍</th>
                    <th onclick="sortTable(3)">Arriving Date ⬍</th>
                    <th onclick="sortTable(4)">Departure Date ⬍</th>
                    <th onclick="sortTable(5)">Status ⬍</th>
                    <th colspan="3">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="booking : ${bookings}"
                    th:classappend="
                        ${booking.bookingStatus.name() == 'CANCELLED'} ? 'cancelled-booking' :
                        (${booking.bookingStatus.name() == 'DECLINED'} ? 'declined-booking' :
                        (${booking.bookingStatus.name() == 'ACCEPTED'} ? 'accepted-booking' : ''))">
                    <td th:text="${booking.bookingId}">1</td>
                    <td th:text="${booking.username}">John Doe</td>
                    <td><span th:text="${booking.roomTitle}">Deluxe Suite</span>
                    (<span th:text="${booking.roomId}">5</span>)</td>
                    <td th:text="${booking.formattedArrivingDate}">10/07/2025</td>
                    <td th:text="${booking.formattedDepartureDate}">12/07/2025</td>
                    <td th:text="${booking.bookingStatus}">PENDING</td>
                    <!-- Edit -->
                    <td class="action-cell borderless">
                        <th:block th:switch="${booking.bookingStatus.name()}">
                            <i th:case="'CANCELLED'" class="fas fa-edit text-muted"
                               title="Cancelled booking cannot be edited"></i>
                            <button th:case="*" type="button" class="btn btn-link p-0" title="Edit"
                                th:attr="data-id=${booking.bookingId},
                                         data-room=${booking.roomTitle},
                                         data-arrival=${booking.formattedArrivingDate},
                                         data-departure=${booking.formattedDepartureDate},
                                         data-status=${booking.bookingStatus}"
                                onclick="openEditModal(this)">
                                <i class="fas fa-edit icon-edit"></i>
                            </button>
                        </th:block>
                    </td>
                    <!-- Decline -->
                    <td class="action-cell borderless">
                        <th:block th:switch="${booking.bookingStatus.name()}">
                            <i th:case="'DECLINED'" class="fas fa-times text-muted" title="Reservation already declined"></i>
                            <i th:case="'CANCELLED'" class="fas fa-times text-muted" title="Cancelled booking"></i>
                            <form th:case="'PENDING'" th:action="@{/api/booking/decline}" method="post" style="display: inline;">
                                <input type="hidden" name="bookingId" th:value="${booking.bookingId}" />
                                <button type="submit" class="btn btn-link p-0" title="Decline">
                                    <i class="fas fa-times text-danger"></i>
                                </button>
                            </form>
                            <i th:case="*" class="fas fa-times text-muted" title="Cannot decline this reservation"></i>
                        </th:block>
                    </td>
                    <!-- Accept -->
                    <td class="action-cell borderless">
                        <th:block th:switch="${booking.bookingStatus.name()}">
                            <i th:case="'ACCEPTED'" class="fas fa-check text-muted" title="Already accepted"></i>
                            <i th:case="'CANCELLED'" class="fas fa-check text-muted" title="Cancelled booking"></i>
                            <form th:case="'PENDING'" th:action="@{/api/booking/accept}" method="post" style="display: inline;">
                                <input type="hidden" name="bookingId" th:value="${booking.bookingId}" />
                                <button type="submit" class="btn btn-link p-0" title="Accept">
                                    <i class="fas fa-check text-success"></i>
                                </button>
                            </form>
                            <i th:case="*" class="fas fa-check text-muted" title="Cannot accept this reservation"></i>
                        </th:block>
                    </td>
                </tr>
            </tbody>
        </table>
        <!-- Modal -->
        <div id="editBookingModal"
            style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); z-index:1000; background:white; border:1px solid #ccc; padding:20px; box-shadow:0 0 15px rgba(0,0,0,0.3); border-radius:10px; max-width:500px; width:90%;">
            <h3>Edit Booking</h3>
            <form id="editBookingForm" th:action="@{/api/booking/edit}" method="post">
                <input type="hidden" name="bookingId" id="editBookingId" class="input-grey"/>
                <div>
                    <label for="editArrivingDate"> Arriving Date</label><br>
                    <input type="date" name="arrivingDate" id="editArrivingDate" class="input-grey" required>
                </div>
                <div>
                    <label for="editDepartureDate"> Departure Date</label><br>
                    <input type="date" name="departureDate" id="editDepartureDate" class="input-grey" required>
                </div>
                <div>
                    <label for="editRoomId"> Room</label><br>
                    <select name="roomId" id="editRoomId" class="input-grey" required>
                        <option th:each="room : ${rooms}" th:value="${room.id}"
                            th:text="${room.roomTitle} + ' (' + ${room.capacity} + 'p)'"></option>
                    </select>
                </div>
                <div>
                    <label for="editBookingStatus"> Status</label><br>
                    <select name="bookingStatus" id="editBookingStatus" class="input-grey" required>
                        <option th:each="status : ${status}" th:value="${status}" th:text="${status}"></option>
                    </select>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <button type="button" onclick="closeEditModal()" class="btn btn-primary">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        let currentSortColumn = -1;
        let currentSortDir = "asc";

        function sortTable(n) {
            const table = document.getElementById("bookingTable");
            const tbody = table.querySelector("tbody");
            const rows = Array.from(tbody.querySelectorAll("tr"));

            let dir = "asc";
            if (n === currentSortColumn && currentSortDir === "asc") dir = "desc";
            currentSortColumn = n;
            currentSortDir = dir;

            rows.sort((rowA, rowB) => {
                let cellA = rowA.cells[n].innerText.trim().toLowerCase();
                let cellB = rowB.cells[n].innerText.trim().toLowerCase();

                const isDate = /\d{2}\/\d{2}\/\d{4}/.test(cellA);
                if (isDate) {
                    cellA = new Date(cellA.split("/").reverse().join("-"));
                    cellB = new Date(cellB.split("/").reverse().join("-"));
                } else if (!isNaN(cellA) && cellA !== '') {
                    cellA = parseFloat(cellA);
                    cellB = parseFloat(cellB);
                }

                return (cellA < cellB ? (dir === "asc" ? -1 : 1) : (cellA > cellB ? (dir === "asc" ? 1 : -1) : 0));
            });

            tbody.innerHTML = "";
            rows.forEach(row => tbody.appendChild(row));
        }

        function openEditModal(button) {
            const bookingId = button.getAttribute("data-id");
            const roomTitle = button.getAttribute("data-room");
            const arrivingDate = formatDateForInput(button.getAttribute("data-arrival"));
            const departureDate = formatDateForInput(button.getAttribute("data-departure"));
            const bookingStatus = button.getAttribute("data-status");

            document.getElementById("editBookingId").value = bookingId;
            document.getElementById("editArrivingDate").value = arrivingDate;
            document.getElementById("editDepartureDate").value = departureDate;
            document.getElementById("editBookingStatus").value = bookingStatus;

            const roomSelect = document.getElementById("editRoomId");
            for (let option of roomSelect.options) {
                if (option.text.includes(roomTitle)) {
                    option.selected = true;
                    break;
                }
            }

            document.getElementById("editBookingModal").style.display = "block";
        }

        function formatDateForInput(dateStr) {
            const parts = dateStr.split("/");
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }

        function closeEditModal() {
            document.getElementById("editBookingModal").style.display = "none";
        }
    </script>
</div>
