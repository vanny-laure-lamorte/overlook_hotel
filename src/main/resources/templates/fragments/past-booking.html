<div th:fragment="fgt-past-booking" id="past-booking">
    <!-- Page Header -->
    <div class="past-booking-header">
        <div class="container-past-booking">
            <h1 class="past-booking-header">My Past Bookings</h1>
            <p class="page-subtitle">Review your previous stays and share your experience.</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container-past-booking">
        <!-- Bookings List -->
        <!-- <div th:if="${not #lists.isEmpty(pastBookings)}"> -->
            <div th:each="booking : ${pastBookings}"  class="booking-card">
                <!-- Booking Header -->
                <div class="booking-header">
                    <div class="booking-title" th:text="${booking.room.roomTitle}"></div>
                    <div class="booking-date">
                        <i class="fas fa-calendar-alt me-2"></i>
                        <span th:text="${#temporals.format(booking.arrivingDate, 'dd/MM/yyyy') + ' → ' + #temporals.format(booking.departureDate, 'dd/MM/yyyy')}"></span>
                    </div>
                </div>

                <!-- Booking Body -->
                <div class="booking-body">
                    <!-- Booking Details -->
                    <div class="booking-details">
                        <div class="detail-item">
                            <i class="fas fa-bed detail-icon"></i>
                            <div class="detail-text">
                                <strong>Room type</strong><br>
                                <span th:text="${booking.room.roomTitle}"></span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-clock detail-icon"></i>
                            <div class="detail-text">
                                <strong>Duration</strong><br>
                                <span th:text="${booking.duration}"></span>
                                <span>day(s)</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-euro-sign detail-icon"></i>
                            <div class="detail-text">
                                <strong>Price</strong><br>
                                <span th:text="${booking.room.price + ' €'}"></span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-user detail-icon"></i>
                            <div class="detail-text">
                                <strong>Guest(s):</strong><br>
                                <span th:text="${booking.adults}"></span>
                                <span>Adults</span>
                                <span th:text="${booking.children}"></span>
                                <span>children</span>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <!-- Feedback Section -->
                    <div class="feedback-section">
                        <div class="feedback-header">
                            <i class="fas fa-star me-2" style="color: var(--purple-700);"></i>
                            <h3 class="feedback-title">Leave a Review</h3>
                        </div>        
                        <!-- Feedback Form -->
                        <div  class="feedback-form">
                            <!-- <div th:insert="~{fragments/feedbacks :: fgt-fee}"></div> -->

                        </div>
                    </div>
                </div>
            <!-- </div> -->
        </div>

        <!-- Empty State -->
        <!-- <div th:if="${#lists.isEmpty(pastBookings)}" class="no-past-booking">
            <i class="fas fa-calendar-times"></i>
            <h3>Aucune réservation passée</h3>
            <p>Vous n'avez pas encore de réservations terminées.</p>
            <a href="#" th:href="@{/bookings}" class="btn btn-primary mt-3">
                <i class="fas fa-plus me-2"></i>
                Faire une réservation
            </a>
        </div> -->
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Rating system
        document.addEventListener('DOMContentLoaded', function() {
            const ratingStars = document.querySelectorAll('.rating-star');
            const ratingInput = document.getElementById('rating');
            
            ratingStars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = this.getAttribute('data-rating');
                    ratingInput.value = rating;
                    
                    // Update visual feedback
                    ratingStars.forEach((s, index) => {
                        if (index < rating) {
                            s.classList.add('active');
                        } else {
                            s.classList.remove('active');
                        }
                    });
                });
                
                star.addEventListener('mouseover', function() {
                    const rating = this.getAttribute('data-rating');
                    
                    ratingStars.forEach((s, index) => {
                        if (index < rating) {
                            s.style.color = '#ffc107';
                        } else {
                            s.style.color = '#ddd';
                        }
                    });
                });
            });
            
            // Reset on mouse leave
            document.querySelector('.rating-input').addEventListener('mouseleave', function() {
                const currentRating = ratingInput.value;
                ratingStars.forEach((s, index) => {
                    if (index < currentRating) {
                        s.style.color = '#ffc107';
                    } else {
                        s.style.color = '#ddd';
                    }
                });
            });
        });

        // Form validation
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                const rating = this.querySelector('input[name="rating"]').value;
                const comment = this.querySelector('textarea[name="comment"]').value.trim();
                
                if (!rating) {
                    e.preventDefault();
                    alert('Veuillez sélectionner une note.');
                    return;
                }
                
                if (!comment) {
                    e.preventDefault();
                    alert('Veuillez saisir un commentaire.');
                    return;
                }
            });
        });
    </script>
</div>
