<div th:fragment="fgt-past-booking" id="past-booking">
     <style>
        :root {
            --primary-color: #3c1053;
            --primary-light: #5a1a7a;
            --primary-dark: #2a0c3d;
            --accent-color: #8b5fbf;
            --light-bg: #f8f9fa;
        }

        body {
            background-color: var(--light-bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            box-shadow: 0 2px 10px rgba(60, 16, 83, 0.2);
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
            font-size: 1.5rem;
        }

        #past-booking {
            margin: 2rem;
        }

        .past-booking-header {
            color: white;
            padding: 3rem 0;
        }

        .page-title {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .booking-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .booking-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(60, 16, 83, 0.15);
        }

        .booking-header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 1.5rem;
        }

        .booking-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .booking-date {
            opacity: 0.9;
            font-size: 0.95rem;
        }

        .booking-body {
            padding: 2rem;
        }

        .booking-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            padding: 0.75rem;
            background: var(--light-bg);
            border-radius: 8px;
        }

        .detail-icon {
            color: var(--primary-color);
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }

        .detail-text {
            font-size: 0.95rem;
        }

        .feedback-section {
            border-top: 2px solid var(--light-bg);
            padding-top: 2rem;
        }

        .feedback-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .feedback-title {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 1.2rem;
            margin: 0;
        }

        .existing-feedback {
            background: linear-gradient(135deg, #e8f5e8, #f0f8f0);
            border-left: 4px solid #28a745;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .feedback-rating {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .star-rating {
            color: #ffc107;
            margin-right: 0.5rem;
        }

        .feedback-form {
            background: var(--light-bg);
            padding: 2rem;
            border-radius: 12px;
            border: 2px dashed var(--accent-color);
        }

        .form-label {
            color: var(--primary-color);
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-control:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.2rem rgba(139, 95, 191, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(60, 16, 83, 0.3);
        }

        .rating-input {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .rating-star {
            font-size: 1.5rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .rating-star:hover,
        .rating-star.active {
            color: #ffc107;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #6c757d;
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 2rem;
            }
            
            .booking-details {
                grid-template-columns: 1fr;
            }
            
            .feedback-form {
                padding: 1.5rem;
            }
        }
    </style>
    <!-- Page Header -->
    <div class="past-booking-header">
        <div class="container-past-booking">
            <h1 class="page-title">Mes Réservations Passées</h1>
            <p class="page-subtitle">Consultez vos anciennes réservations et partagez votre expérience</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container-past-booking">
        <!-- Bookings List -->
        <!-- <div th:if="${not #lists.isEmpty(pastBookings)}"> -->
            <div th:each="booking : ${pastBookings}"  class="booking-card">
                <!-- Booking Header -->
                <div class="booking-header">
                    <div class="booking-title" th:text="${booking.room.roomTitle}"></div>
                    <div class="booking-date">
                        <i class="fas fa-calendar-alt me-2"></i>
                        <span th:text="${#temporals.format(booking.arrivingDate, 'dd/MM/yyyy') + ' → ' + #temporals.format(booking.departureDate, 'dd/MM/yyyy')}"></span>
                    </div>
                </div>

                <!-- Booking Body -->
                <div class="booking-body">
                    <!-- Booking Details -->
                    <div class="booking-details">
                        <div class="detail-item">
                            <i class="fas fa-bed detail-icon"></i>
                            <div class="detail-text">
                                <strong>Room type</strong><br>
                                <span th:text="${booking.room.roomTitle}"></span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-clock detail-icon"></i>
                            <div class="detail-text">
                                <strong>Duration</strong><br>
                                <span th:text="${booking.duration}"></span>
                                <span>day(s)</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-euro-sign detail-icon"></i>
                            <div class="detail-text">
                                <strong>Price</strong><br>
                                <span th:text="${booking.room.price + ' €'}"></span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-user detail-icon"></i>
                            <div class="detail-text">
                                <strong>Guest(s):</strong><br>
                                <span th:text="${booking.adults}"></span>
                                <span>Adults</span>
                                <span th:text="${booking.children}"></span>
                                <span>children</span>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <!-- Feedback Section -->
                    <div class="feedback-section">
                        <div class="feedback-header">
                            <i class="fas fa-star me-2" style="color: var(--accent-color);"></i>
                            <h3 class="feedback-title">Leave a Review</h3>
                        </div>        
                        <!-- Feedback Form -->
                        <div  class="feedback-form">
                            <!-- <div th:insert="~{fragments/feedbacks :: fgt-fee}"></div> -->

                        </div>
                    </div>
                </div>
            <!-- </div> -->
        </div>

        <!-- Empty State -->
        <!-- <div th:if="${#lists.isEmpty(pastBookings)}" class="empty-state">
            <i class="fas fa-calendar-times"></i>
            <h3>Aucune réservation passée</h3>
            <p>Vous n'avez pas encore de réservations terminées.</p>
            <a href="#" th:href="@{/bookings}" class="btn btn-primary mt-3">
                <i class="fas fa-plus me-2"></i>
                Faire une réservation
            </a>
        </div> -->
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Rating system
        document.addEventListener('DOMContentLoaded', function() {
            const ratingStars = document.querySelectorAll('.rating-star');
            const ratingInput = document.getElementById('rating');
            
            ratingStars.forEach(star => {
                star.addEventListener('click', function() {
                    const rating = this.getAttribute('data-rating');
                    ratingInput.value = rating;
                    
                    // Update visual feedback
                    ratingStars.forEach((s, index) => {
                        if (index < rating) {
                            s.classList.add('active');
                        } else {
                            s.classList.remove('active');
                        }
                    });
                });
                
                star.addEventListener('mouseover', function() {
                    const rating = this.getAttribute('data-rating');
                    
                    ratingStars.forEach((s, index) => {
                        if (index < rating) {
                            s.style.color = '#ffc107';
                        } else {
                            s.style.color = '#ddd';
                        }
                    });
                });
            });
            
            // Reset on mouse leave
            document.querySelector('.rating-input').addEventListener('mouseleave', function() {
                const currentRating = ratingInput.value;
                ratingStars.forEach((s, index) => {
                    if (index < currentRating) {
                        s.style.color = '#ffc107';
                    } else {
                        s.style.color = '#ddd';
                    }
                });
            });
        });

        // Form validation
        document.querySelectorAll('form').forEach(form => {
            form.addEventListener('submit', function(e) {
                const rating = this.querySelector('input[name="rating"]').value;
                const comment = this.querySelector('textarea[name="comment"]').value.trim();
                
                if (!rating) {
                    e.preventDefault();
                    alert('Veuillez sélectionner une note.');
                    return;
                }
                
                if (!comment) {
                    e.preventDefault();
                    alert('Veuillez saisir un commentaire.');
                    return;
                }
            });
        });
    </script>
</div>
