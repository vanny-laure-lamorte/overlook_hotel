<header th:fragment="header">
    <!-- Top header -->
    <div class="top-header">
        <div class="container">
            <!-- Logo -->
            <a href="/" class="logo">
                <img th:src="@{/images/icone-logo/suite-dreams-logo-trans.png}" alt="Logo">
                <span class="logo-text">Suite Dream</span>
            </a>
            <div id="logoutMessage" class="alert alert-info" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>
            <div class="right-items">
                <!-- Language selector -->
                <div class="dropdown">
                    <button class="dropdown-button">
                        <img th:src="@{/images/icone-logo/icons8-france-circulaire.png}" alt="Français"
                            class="flag-icon" />
                    </button>
                    <div class="dropdown-content">
                        <div class="dropdown-item">
                            <img th:src="@{/images/icone-logo/icons8-france-circulaire.png}" alt="Français"
                                class="flag-icon">
                            <span>Français</span>
                        </div>
                        <div class="dropdown-item">
                            <img th:src="@{/images/icone-logo/icons8-uk-circulaire.png}" alt="English"
                                class="flag-icon">
                            <span>English</span>
                        </div>
                        <div class="dropdown-item">
                            <img th:src="@{/images/icone-logo/icons8-espagne-circulaire.png}" alt="Español"
                                class="flag-icon">
                            <span>Español</span>
                        </div>
                    </div>
                </div>
                <!-- Contact icon -->
                <button class="contact-button" aria-label="Contact">
                    <i class="fas fa-question-circle" style="font-size: 25px;"></i>
                </button>

                <!-- Authentication - Logged Out State -->
                <div class="auth-buttons logged-out" th:if="${isAuthenticated == false}">
                    <button id="loginButton" class="btn btn-outline-white">Login/Register</button>
                </div>

                <!-- Authentication - Logged In State -->
                <div class="auth-buttons logged-in" th:if="${isAuthenticated}">
                    <div class="dropdown">
                        <button class="btn btn-outline-white">
                            <i class="fas fa-user" style="font-size: 0.875rem;"></i>
                            <span>My profil</span>
                            <i class="fas fa-chevron-down" style="font-size: 0.75rem;"></i>
                        </button>
                        <div class="dropdown-content">
                            <div class="dropdown-item">
                                <form th:action="@{/profile}" method="get">
                                    <button type="submit" class="btn btn-link auth-buttons">
                                        <i class="fas fa-user" style="margin-right: 8px; font-size: 0.875rem;"></i>
                                        <span>My profil</span>
                                    </button>
                                </form>
                            </div>
                            <div class="dropdown-item">
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="btn btn-link logout-button  auth-buttons">
                                        <i class="fas fa-user" style="margin-right: 8px; font-size: 0.875rem;"></i>
                                        <span>Se déconnecter</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const logoutMessage = document.getElementById("logoutMessage");
            if (logoutMessage) {
                logoutMessage.classList.add("fade-out");
                setTimeout(() => {
                    logoutMessage.classList.add("hidden");
                    setTimeout(() => {
                        logoutMessage.style.display = "none";
                    }, 1000);
                }, 3000);
            }
        });
    </script>
</header>
