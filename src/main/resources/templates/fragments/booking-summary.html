<div th:fragment="fgt-booking-summary" id="our-rooms">
    <div class="rooms-list">
        <div class="room-card">
            <div class="image-container">
                <img th:each="i : ${#numbers.sequence(1, 3)}"
                    th:src="@{'/images/rooms/' + ${room.roomImage} + ${i} + '.jpg'}"
                    th:alt="${room.roomTitle + ' image ' + i}" class="room-image" />
            </div>
            <div class="room-details">
                <div class="room-header">
                    <h2 class="room-name" th:text="${roomName}">Room Title</h2>
                    <span th:text="${room.price} + ' € / night'">100 € / night</span>
                </div>

                <p class="room-description" th:text="${room.roomDescription}">
                    A cozy and elegant room with modern amenities...
                </p>
                <div class="amenities" style="display: inline-block;">
                    <strong>Amenities:</strong>
                    <span th:each=" amenity : ${room.amenitiesWords}" class="badge" th:text="${amenity}"></span>
                </div>

                <div class="details"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.5rem; margin-top: 1rem;">
                    <div>
                        <strong>Room Capacity:</strong>
                        <span th:text="${room.capacity} + ' person(s)'">2 persons</span>
                    </div>
                    <div>
                        <strong>Guests:</strong>
                        <span th:text="${adultsCount} + ' adult(s)' + ' & ' + ${childrenCount} + ' child(ren)'">2</span>
                    </div>
                    <div>
                        <strong>Dates:</strong>
                        <span th:text="${arrivalDate} + ' → ' + ${departureDate}">2025-08-01 → 2025-08-03</span>
                    </div>
                </div>
                <form th:action="@{/view/booking/summary}" method="get" style="margin-top: 1.5rem;">
                    <input type="hidden" name="roomId" th:value="${room.id}" />
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <label for="arrivalDate"><strong>Arrival:</strong></label>
                            <input class="input-grey" type="date" name="arrivalDate" th:value="${arrivalDate}"
                                required />
                        </div>
                        <div>
                            <label for="departureDate"><strong>Departure:</strong></label>
                            <input class="input-grey" type="date" name="departureDate" th:value="${departureDate}"
                                required />
                        </div>
                        <div>
                            <input type="hidden" name="AdultsCount" th:value="${adultsCount}" required />
                        </div>
                        <div>
                            <input type="hidden" name="ChildrenCount" th:value="${childrenCount}" />
                        </div>
                        <div style="align-self: flex-end;">
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
