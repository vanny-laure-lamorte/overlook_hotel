<div th:fragment="fgt-booking-summary" id="our-rooms">
    <div class="rooms-list">
        <div th:if="${paymentMessage == 'success'}" class="alert alert-success">
            ✅ Payment successful! Thank you for your booking.
        </div>
        <div th:if="${paymentMessage == 'cancel'}" class="alert alert-danger">
            ❌ Payment was cancelled. You can try again below.
        </div>
        <div class="room-card">
            <div class="room-header" style="padding: 1rem; border-bottom: 1px solid #eee; flex-wrap: wrap;">
                <h2 class="room-name" th:text="${roomName}" style="margin-bottom: 0.5rem;">Room Title</h2>
                <p style="margin: 0;" th:text="${room.roomDescription}">Description courte...</p>
                <p style="font-size: 0.85rem; margin-top: 0.5rem;">
                    <strong>Capacity:</strong> <span th:text="${room.capacity} + ' person(s)'">2</span> |
                    <span th:each="amenity : ${room.amenitiesWords}" class="badge" th:text="${amenity}">Wi-Fi</span>
                </p>
            </div>
            <div class="room-details">
                <div style="border: 1px solid #ddd; border-radius: 6px; padding: 1rem; background: #f9f9f9;">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem;">
                        <div>
                            <strong>Guests:</strong>
                            <span th:text="${adultsCount} + ' adult(s) & ' + ${childrenCount} + ' child(ren)'">2
                                adults</span>
                        </div>
                        <div>
                            <strong>Dates:</strong>
                            <span th:text="${arrivalDate} + ' → ' + ${departureDate}">2025-08-01 → 2025-08-03</span>
                        </div>
                        <div>
                            <strong>Price:</strong>
                            <span th:text="${room.price} + ' € / night'">100 €</span>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <div th:replace="fragments/payment-button :: fgt-payment-button(${room.price}, ${stripePublicKey})">
                    </div>
                    <button type="button" class="btn btn-tertiary" onclick="toggleDateEditor()">Modify dates</button>
                </div>
                <form id="dateEditor" th:action="@{/view/booking/summary}" method="get"
                    style="margin-top: 1rem; display: none; background: #f1f1f1; padding: 1rem; border-radius: 6px;">
                    <input type="hidden" name="roomId" th:value="${room.id}" />
                    <input type="hidden" name="userId" th:value="${userId}" />
                    <input type="hidden" name="AdultsCount" th:value="${adultsCount}" />
                    <input type="hidden" name="ChildrenCount" th:value="${childrenCount}" />
                    <div style="display: flex; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <label><strong>Arrival:</strong></label>
                            <input class="input-grey" type="date" name="arrivalDate" th:value="${arrivalDate}"
                                required />
                        </div>
                        <div>
                            <label><strong>Departure:</strong></label>
                            <input class="input-grey" type="date" name="departureDate" th:value="${departureDate}"
                                required />
                        </div>
                        <div style="align-self: flex-end;">
                            <button type="submit" class="btn btn-secondary">Update</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function toggleDateEditor() {
            const editor = document.getElementById('dateEditor');
            editor.style.display = editor.style.display === 'none' ? 'block' : 'none';
        }
    </script>
</div>
