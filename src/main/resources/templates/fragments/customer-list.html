<div th:fragment="fgt-customer-list">
    <h2>Customers List</h2>
    <div class="sd-custom-table-wrapper">
        <table class="sd-custom-table">
            <thead>
                <tr>
                    <th>id</th>
                    <th>LastName</th>
                    <th>FirstName</th>
                    <th>Date of Birth</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="customer : ${customersList}">
                    <td th:text="${customer.id}">1</td>
                    <td th:text="${customer.lastName}">LastName</td>
                    <td th:text="${customer.firstName}">FirstName</td>
                    <td th:text="${#dates.format(customer.dob, 'dd/MM/yyyy')}">01/01/2000</td>
                    <td th:text="${customer.role.roleName}">Role</td>
                    <td class="action-cell borderless">
                        <button type="button" class="btn btn-link p-0" title="Edit" th:attr="data-id=${customer.id},
                         data-firstname=${customer.firstName},
                         data-lastname=${customer.lastName},
                         data-dob=${#dates.format(customer.dob, 'dd/MM/yyyy')},
                         data-role=${customer.role.roleName},
                         data-address=${customer.userAddress}" onclick="openEditCustomerModal(this)">
                            <i class="fas fa-edit icon-edit"></i>
                        </button>
                    </td>
                </tr>
            </tbody>

        </table>
    </div>
    <div id="editCustomerModal"
        style="display:none; position:fixed; top:10%; left:50%; transform:translateX(-50%); z-index:1000; background:white; border:1px solid #ccc; padding:20px; box-shadow:0 0 15px rgba(0,0,0,0.3); border-radius:10px; max-width:500px; width:90%;">
        <h3>Edit Customer <span id="editCustomerIdDisplay"></span></h3>
        <form id="editCustomerForm" th:action="@{/api/customers/edit}" method="post">
            <input type="hidden" name="id" id="editCustomerId" />
            <p id="editCustomerIdDisplay"></p>

            <label for="editFirstName">First Name:</label>
            <input type="text" name="firstName" id="editFirstName" required><br><br>

            <label for="editLastName">Last Name:</label>
            <input type="text" name="lastName" id="editLastName" required><br><br>

            <label for="editDob">Date of Birth:</label>
            <input type="date" name="dob" id="editDob" required><br><br>

            <label for="editAddress">Address:</label>
            <input type="text" name="address" id="editAddress" required><br><br>

            <label for="editRole">Role:</label>
            <select name="role" id="editRole" required>
                <option value="customer">Customer</option>
                <option value="employee">Employee</option>
                <option value="admin">Admin</option>
            </select><br><br>

            <button type="submit">Save Changes</button>
            <button type="button" onclick="closeEditCustomerModal()">Cancel</button>
        </form>
        <form id="deleteCustomerForm" th:action="@{/api/customers/delete}" method="post">
            <!-- <input type="hidden" name="deleteId" id="customerId" /> -->
            <input  name="customerId" id="deleteCustomerId" />
            <button type="submit" class="btn btn-danger" onclick="closeEditCustomerModal()">Delete Customer</button>
            <i class="fas fa-trash-alt mx-5 icon-delete"></i>
        </form>
    </div>
    <script>
        function openEditCustomerModal(button) {
            const customerId = button.getAttribute("data-id");
            const firstName = button.getAttribute("data-firstname");
            const lastName = button.getAttribute("data-lastname");
            const dob = button.getAttribute("data-dob");
            const address = button.getAttribute("data-address");
            const role = button.getAttribute("data-role");

            document.getElementById("editCustomerId").value = customerId;
            document.getElementById("editFirstName").value = firstName;
            document.getElementById("editLastName").value = lastName;
            document.getElementById("editDob").value = formatDateForInput(dob);
            document.getElementById("editAddress").value = address;
            document.getElementById("editRole").value = role;
            document.getElementById("deleteCustomerId").value = customerId;

            document.getElementById("editCustomerIdDisplay").textContent = `#${customerId}`;

            document.getElementById("editCustomerModal").style.display = "block";
        }

        function closeEditCustomerModal() {
            document.getElementById("editCustomerModal").style.display = "none";
        }

        function formatDateForInput(dateStr) {
            const parts = dateStr.split("/");
            return `${parts[2]}-${parts[1]}-${parts[0]}`;
        }
    </script>
</div>
