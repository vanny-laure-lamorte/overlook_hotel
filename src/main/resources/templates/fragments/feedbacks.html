<div th:fragment="fgt-feedback" id="feedbacks-widget" class="container-feeback">
        <div class="form-card">
            <div class="form-header">
                <h1>Share Your Experience</h1>
                <p>Help other travelers by sharing your honest review</p>
            </div>

            <form th:action="@{/feedback/submit}" th:object="${feedback}" method="post" class="form-content">
                <!-- Hidden fields -->
                <!-- <input type="hidden" th:field="*{hotelUserId}" />
                <input type="hidden" th:field="*{bookingId}"/> -->
                <input type="hidden" name="hotelUserId" th:value="${hotelUserId}" />
                <input type="hidden" name="bookingId" th:value="${bookingId}" />

                <div class="form-section">
                    <h2 class="section-title">Travel Details</h2>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="travelForWork"  th:field="*{travelForWork}"  />
                            <label for="travelForWork">I traveled for work</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="travelCompanions">Who did you travel with? <span class="required">*</span></label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="alone" name="travelCompanions" value="alone" th:field="*{travelCompanions}" />
                                <label for="alone">Solo traveler</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="partner" name="travelCompanions" value="partner" th:field="*{travelCompanions}" />
                                <label for="partner">Partner</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="family" name="travelCompanions" value="family" th:field="*{travelCompanions}" />
                                <label for="family">Family</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="friends" name="travelCompanions" value="friends" th:field="*{travelCompanions}" />
                                <label for="friends">Friends</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="colleagues" name="travelCompanions" value="colleagues" th:field="*{travelCompanions}" />
                                <label for="colleagues">Colleagues</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Expectations Section -->
                <div class="form-section">
                    <h2 class="section-title">Your Experience</h2>

                    <div class="form-group">
                        <label for="expectationMet">Did this hotel meet your expectations? <span class="required">*</span></label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="exceeded" name="expectationMet" value="exceeded" th:field="*{expectationMet}" />
                                <label for="exceeded">Exceeded expectations</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="yes" name="expectationMet" value="yes" th:field="*{expectationMet}" />
                                <label for="yes">Met expectations</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="no" name="expectationMet" value="no" th:field="*{expectationMet}" />
                                <label for="no">Below expectations</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="rating">Overall rating <span class="required">*</span></label>
                        <div class="rating-container">
                            <div class="star-rating">
                                <span class="star" data-rating="1">★</span>
                                <span class="star" data-rating="2">★</span>
                                <span class="star" data-rating="3">★</span>
                                <span class="star" data-rating="4">★</span>
                                <span class="star" data-rating="5">★</span>
                            </div>
                        </div>
                        <input type="hidden" name="rating" id="rating" th:field="*{rating}" />
                    </div>
                </div>

                <!-- Detailed Feedback Section -->
                <div class="form-section">
                    <h2 class="section-title">Tell Us More</h2>
                    <div class="form-group">
                        <label for="likes">What did you like most about your stay?</label>
                        <textarea id="likes" th:field="*{likes}" class="form-control textarea"
                                placeholder="e.g., Clean rooms, friendly staff, great location..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="dislikes">What could be improved?</label>
                        <textarea id="dislikes" th:field="*{dislikes}" class="form-control textarea"
                                placeholder="e.g., Noise levels, room size, amenities..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="summary">Summary of your stay</label>
                        <input type="text" id="summary" th:field="*{summary}" class="form-control"
                               placeholder="Brief summary in a few words" />
                    </div>
                </div>
                <div class="submit-section">
                    <button
                        type="submit"
                        class="btn-submit"
                        value="Submit">Submit Review</button>
                    <p style="margin-top: 1rem; color: #666; font-size: 0.9rem;">
                        Your review helps other travelers make informed decisions
                    </p>
                </div>
            </form>
        </div>
      <script>
document.addEventListener("DOMContentLoaded", function () {
    const stars = document.querySelectorAll('.star-rating .star');
    const ratingInput = document.getElementById('rating');
    const ratingText = document.getElementById('ratingText');

    let selectedRating = parseInt(ratingInput.value) || 0;

    // Si une valeur est déjà présente, afficher les étoiles correspondantes
    if (selectedRating > 0) {
        highlightStars(selectedRating);
        ratingText.innerText = `You rated: ${selectedRating} star${selectedRating > 1 ? 's' : ''}`;
    }

    stars.forEach(star => {
        // Hover effect
        star.addEventListener('mouseover', () => {
            const rating = parseInt(star.dataset.rating);
            highlightStars(rating);
        });

        // Reset hover
        star.addEventListener('mouseout', () => {
            highlightStars(selectedRating);
        });

        // Click event
        star.addEventListener('click', () => {
            selectedRating = parseInt(star.dataset.rating);
            ratingInput.value = selectedRating;
            highlightStars(selectedRating);
            console.log("Note sélectionnée :", selectedRating);
        });
    });

    function highlightStars(rating) {
        stars.forEach(star => {
            const starRating = parseInt(star.dataset.rating);
            star.classList.toggle('selected', starRating <= rating);
        });
    }
});
</script>

</div>
